# OpenSSF Scorecard：供应链体检。
#
# 它查的正是本仓这一层关心的东西——脚本注入、token 权限、依赖是否钉版、分支保护是否
# 存在。结果同时进 code scanning 面板与 OpenSSF 公有 API（本仓是 public 仓）。
#
# 写权限面与两处写入一一对应：publish_results 由 OIDC 换身份上传，要 id-token: write；
# SARIF 进 code scanning 面板，要 security-events: write。两者都不需要 contents 的写权限。
name: scorecard
on:
  # 分支保护/ruleset 变更时重跑，否则 Branch-Protection 这项检查只会停在旧值上。
  branch_protection_rule:
  # 手动入口：同上。注意下面的 if 要求「在默认分支上跑」，所以在功能分支上手跑时该 job
  # 会被跳过——这不是故障。
  workflow_dispatch: {}
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: [main]
# push 与每周 cron 各成一组：同时到达时并行跑（cron 的全量扫描不被 push 取消），
# 同组内的重跑才互相取消。publish_results: true 每次运行都会向 OpenSSF API 发一次结果，
# 不设并发控制时两个 run 各发一份。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
# 工作流级全只读；两个写权限只挂在 analysis job 上。
permissions: read-all
jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # publish_results: true 只在默认分支生效，所以在非默认分支上不跑这条。
    # 比较完整 ref：tag 的 ref_name 也可能恰与默认分支同名，按名字比较会把 tag 的树
    # 当成默认分支发布出去。
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      security-events: write
      id-token: write
      # job 级 permissions 一旦写了，没列出的项一律是 none，checkout 也就读不到仓库内容。
      # 这里显式补回来：它要的是读，与上面两项写权限不冲突。
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 不让 checkout 把 token 留在 .git/config 里：后续步骤不该能借它推代码。
          persist-credentials: false
      - name: Run analysis
        # 钉 commit SHA：tag 可以被上游移动，而这条 workflow 的结论进公开 API。
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      # 两个上传步骤都 if: always()：发布环节（publish_results 走 OIDC 换身份）单独失败
      # 时，已生成的 results.sarif 仍要进面板与 artifact，不被上游步骤的失败连坐跳过。
      # artifact 上传额外 continue-on-error 且排在 SARIF 上传之后：面板更新优先于留档，
      # artifact 服务抖动不得反过来挡面板。
      - name: Upload to code-scanning
        # 只有 Run analysis 真的写出了 SARIF 才上传：它若在写文件前失败（拉取超时、
        # scorecard 自身报错），always() 会让这一步以「文件不存在」再红一次，
        # 盖住真正的根因。
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
      - name: Upload artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
