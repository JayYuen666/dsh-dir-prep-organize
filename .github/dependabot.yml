# 依赖更新：action 一条线。
#
# action 侧覆盖本仓的全部 workflow 引用：这些引用都钉了 commit SHA，Dependabot 提的 PR
# 会把「换了哪个提交」变成一次可评审的 diff。
#
# 这里刻意**没有** npm 更新块：本仓依赖只有两类，两类都不该由更新机器人改动。
# 一是工具链与大部分宿主依赖写成 catalog:，那条范围的真源在伞根的 pnpm-workspace.yaml；
# 二是其余依赖写成字面版本，其中宿主族与主要传递依赖在 overrides 里被钉死
# （宿主族统一 0.2.2-alpha.2 那条线）。Dependabot 对第二类提的 PR 会被 overrides 解析回
# 原版本，合进去也不改变安装树——留着它只会造出「看起来升了、实际没升」的 PR。
# 反过来说，不在 overrides 里的 react / react-dom 与 peer 范围确实没有自动更新覆盖：
# 这是接受「机器人不去动它们」的代价，不是「已被钉死」的等价说法。
# 要升这些版本只能在伞根改真源，再投影下来。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # 本仓引用的 action 全部放进一组，避免每个 action 各占一个 PR 去抢同一个名额。
      # github-actions 生态的依赖名本身就是 `<owner>/<repo>[/path]`，一条 `*` 覆盖全部引用；
      # 按 owner 列举会在引入未列出的来源时静默漏掉，那些 PR 会各自占用 open-pull-requests-limit。
      actions:
        patterns:
          - "*"
